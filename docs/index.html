<!doctype html>
<html lang="es" data-theme="light">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Mi Colección</title>
        <link rel="stylesheet" href="styles.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <style>
            .hub-section {
                min-height: calc(100vh - var(--header-height) - 100px);
                display: flex;
                align-items: center;
                padding: var(--spacing-3xl) 0;
            }
            .hub-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: var(--spacing-2xl);
                width: 100%;
            }
            @media (max-width: 768px) {
                .hub-grid { grid-template-columns: 1fr; }
            }
            .hub-card {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                text-decoration: none;
                color: inherit;
                background: var(--bg-secondary);
                border: 2px solid var(--border-color);
                border-radius: var(--border-radius-xl);
                padding: var(--spacing-3xl) var(--spacing-2xl);
                text-align: center;
                transition: all var(--transition-normal);
                box-shadow: var(--shadow-md);
                min-height: 340px;
                position: relative;
                overflow: hidden;
            }
            .hub-card::before {
                content: '';
                position: absolute;
                inset: 0;
                opacity: 0;
                transition: opacity var(--transition-normal);
                pointer-events: none;
            }
            .hub-card--music::before {
                background: linear-gradient(135deg, rgba(59,130,246,0.08), rgba(139,92,246,0.08));
            }
            .hub-card--cine::before {
                background: linear-gradient(135deg, rgba(245,158,11,0.08), rgba(239,68,68,0.08));
            }
            .hub-card:hover {
                transform: translateY(-8px);
                box-shadow: var(--shadow-xl);
            }
            .hub-card:hover::before { opacity: 1; }
            .hub-card--music:hover { border-color: var(--color-primary); }
            .hub-card--cine:hover  { border-color: var(--color-accent);  }
            .hub-icon {
                font-size: 5rem;
                margin-bottom: var(--spacing-xl);
                line-height: 1;
                position: relative;
                z-index: 1;
            }
            .hub-title {
                font-size: var(--font-size-3xl);
                font-weight: 700;
                margin-bottom: var(--spacing-md);
                position: relative;
                z-index: 1;
            }
            .hub-card--music .hub-title { color: var(--color-primary); }
            .hub-card--cine  .hub-title { color: var(--color-accent);  }
            .hub-desc {
                font-size: var(--font-size-base);
                color: var(--text-muted);
                max-width: 300px;
                line-height: 1.6;
                margin: 0;
                position: relative;
                z-index: 1;
            }
            .hub-arrow {
                margin-top: var(--spacing-xl);
                font-size: var(--font-size-2xl);
                opacity: 0;
                transform: translateX(-8px);
                transition: all var(--transition-normal);
                position: relative;
                z-index: 1;
            }
            .hub-card:hover .hub-arrow {
                opacity: 1;
                transform: translateX(0);
            }
            .site-footer {
                padding: var(--spacing-xl) 0;
                text-align: center;
                color: var(--text-muted);
                font-size: var(--font-size-sm);
                border-top: 1px solid var(--border-color);
            }
        </style>
    </head>
    <body>
        <header class="site-header">
            <div class="container">
                <nav class="site-nav">
                    <div class="site-logo">
                        <span class="logo-icon">📼</span>
                        <span class="logo-text">Mi Colección</span>
                    </div>
                    <div class="nav-links">
                        <button class="theme-toggle" aria-label="Cambiar tema">🌙</button>
                    </div>
                </nav>
            </div>
        </header>

        <main class="main-content">
            <div class="container">
                <section class="hub-section">
                    <div class="hub-grid">
                        <a href="musica.html" class="hub-card hub-card--music">
                            <div class="hub-icon">🎵</div>
                            <h2 class="hub-title">Música</h2>
                            <p class="hub-desc">Álbumes asociados a tarjetas NFC con información completa, letras y enlaces</p>
                            <span class="hub-arrow">→</span>
                        </a>
                        <a href="cine.html" class="hub-card hub-card--cine">
                            <div class="hub-icon">🎬</div>
                            <h2 class="hub-title">Cine</h2>
                            <p class="hub-desc">Películas y series asociadas a tarjetas NFC para reproducir al instante</p>
                            <span class="hub-arrow">→</span>
                        </a>
                    </div>
                </section>
            </div>
        </main>

        <footer class="site-footer">
            <div class="container">
                <p>disfruta</p>
            </div>
        </footer>

        <script src="script.js"></script>
    </body>
</html>
